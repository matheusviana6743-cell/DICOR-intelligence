name: Activate BO mensal
on:
  push:
    branches: [main]

jobs:
  activate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Ativar modulo BO mensal no start_safe
        shell: python
        run: |
          from pathlib import Path
          p = Path('start_safe.py')
          s = p.read_text(encoding='utf-8')
          marker = 'import bot\n'
          line = 'import bo_mensal_v166  # BO mensal: origem fixa + reset mensal\n'
          if line not in s:
              s = s.replace(marker, marker + line, 1)
              p.write_text(s, encoding='utf-8')
          print('BO mensal ativado no start_safe.py')
      - name: Commit ativacao
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add start_safe.py
          if git diff --cached --quiet; then
            echo 'Nada para commitar'
          else
            git commit -m 'fix: ativar BO mensal no startup'
            git push
          fi
