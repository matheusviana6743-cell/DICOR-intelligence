name: BOT FORGE Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  generators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run generator and production tests
        run: python -m pytest -q
